# .github/workflows/standup.yml
name: Standup digest
on:
  schedule:
    # 04:00 UTC = 09:30 IST, Monday to Friday
    - cron: "0 4 * * 1-5"
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rahulcs754/BlockerRadar@main
        with:
          # A fine-grained PAT with read access to every repo in the config.
          github-token: ${{ secrets.BLOCKERRADAR_GITHUB_TOKEN }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
