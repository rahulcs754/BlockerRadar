name: BlockerRadar
description: Drafts the daily standup from GitHub + Jira/Linear, finds blockers from the data, and posts one Slack digest.
branding:
  icon: radio
  color: red
inputs:
  config:
    description: Path to the BlockerRadar config file.
    default: blockerradar.yml
  github-token:
    description: Token to read PRs and CI. The default token only sees this repo; use a fine-grained PAT for more repos.
    default: ${{ github.token }}
  dry-run:
    description: "true: print the digest in the job log and summary, do not post to Slack."
    default: "false"
outputs:
  blockers:
    description: Number of blockers found.
runs:
  using: node24
  main: dist/action.js
